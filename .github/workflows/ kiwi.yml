name: Build VoiceLock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project files
        run: |
          mkdir -p app/src/main/java/com/example/voicelock app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoiceLock"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.voicelock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.voicelock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="VoiceLock"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".AdminReceiver"
                      android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/device_admin.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin>
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat > app/src/main/java/com/example/voicelock/AdminReceiver.kt <<'EOF'
          package com.example.voicelock

          import android.app.admin.DeviceAdminReceiver

          class AdminReceiver : DeviceAdminReceiver()
          EOF

          cat > app/src/main/java/com/example/voicelock/MainActivity.kt <<'EOF'
          package com.example.voicelock

          import android.Manifest
          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(TextView(this).apply {
                      text = "VoiceLock is running.\n\nSay: \"lock screen\" or \"turn on screen\""
                      textSize = 20f
                      setPadding(48, 96, 48, 48)
                  })

                  val needed = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) needed.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(needed.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return

                  val dpm = getSystemService(DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = ComponentName(this, AdminReceiver::class.java)
                  if (!dpm.isAdminActive(admin)) {
                      startActivityForResult(
                          Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                              .putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin), 2
                      )
                  } else {
                      startForegroundService(Intent(this, VoiceService::class.java))
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2) startForegroundService(Intent(this, VoiceService::class.java))
              }
          }
          EOF

          cat > app/src/main/java/com/example/voicelock/VoiceService.kt <<'EOF'
          package com.example.voicelock

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer

          class VoiceService : Service() {

              private lateinit var recognizer: SpeechRecognizer
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("vl", "VoiceLock", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "vl")
                      .setContentTitle("VoiceLock is listening")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)

                  recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(results: Bundle?) {
                          results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull()?.let { handle(it.lowercase()) }
                          listenAgain()
                      }
                      override fun onError(error: Int) {
                          if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) recognizer.cancel()
                          listenAgain()
                      }
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  listenAgain()
              }

              private fun listenAgain() {
                  handler.postDelayed({
                      muteBeep(true)
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                      recognizer.startListening(i)
                  }, 1000)
              }

              private fun handle(text: String) {
                  if ("unlock" in text) return
                  when {
                      "turn on screen" in text || "screen on" in text || "wake up" in text -> {
                          val pm = getSystemService(POWER_SERVICE) as PowerManager
                          @Suppress("DEPRECATION")
                          val wl = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "voicelock:wake"
                          )
                          wl.acquire(5000)
                      }
                      "lock" in text || "turn off screen" in text || "screen off" in text -> {
                          val dpm = getSystemService(DEVICE_POLICY_SERVICE) as DevicePolicyManager
                          if (dpm.isAdminActive(ComponentName(this, AdminReceiver::class.java))) dpm.lockNow()
                      }
                  }
              }

              private fun muteBeep(mute: Boolean) {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val dir = if (mute) AudioManager.ADJUST_MUTE else AudioManager.ADJUST_UNMUTE
                  for (s in listOf(
                      AudioManager.STREAM_NOTIFICATION,
                      AudioManager.STREAM_SYSTEM,
                      AudioManager.STREAM_MUSIC
                  )) {
                      try { am.adjustStreamVolume(s, dir, 0) } catch (e: Exception) {}
                  }
              }

              override fun onDestroy() {
                  muteBeep(false)
                  recognizer.destroy()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: VoiceLock APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
